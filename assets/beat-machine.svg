<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Beat Machine project graphic</title>
  <desc id="desc">A neon drum machine interface with pads, knobs, and waveform lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22113f"/>
      <stop offset="0.52" stop-color="#080b14"/>
      <stop offset="1" stop-color="#142d3e"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.54 0 0 0 0 0.36 0 0 0 0 0.96 0 0 0 .7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" rx="120" fill="url(#bg)"/>
  <rect x="90" y="130" width="720" height="610" rx="48" fill="#101522" stroke="#ffffff" stroke-opacity=".16" stroke-width="6"/>
  <g filter="url(#glow)">
    <path d="M158 255h55l26-72 46 148 44-112 31 68h73" fill="none" stroke="#f7bf4f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="230" text-anchor="middle" fill="#f7f7fb" font-family="Arial Black, Arial, sans-serif" font-size="74" font-weight="900">BEAT</text>
    <text x="450" y="300" text-anchor="middle" fill="#38bdf8" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900">MACHINE</text>
  </g>
  <g transform="translate(170 365)">
    <g fill="url(#pad)" filter="url(#glow)">
      <rect x="0" y="0" width="120" height="120" rx="22"/>
      <rect x="150" y="0" width="120" height="120" rx="22" opacity=".86"/>
      <rect x="300" y="0" width="120" height="120" rx="22"/>
      <rect x="450" y="0" width="120" height="120" rx="22" opacity=".86"/>
      <rect x="0" y="150" width="120" height="120" rx="22" opacity=".86"/>
      <rect x="150" y="150" width="120" height="120" rx="22"/>
      <rect x="300" y="150" width="120" height="120" rx="22" opacity=".86"/>
      <rect x="450" y="150" width="120" height="120" rx="22"/>
    </g>
    <g fill="#05070b" opacity=".42">
      <circle cx="60" cy="60" r="18"/>
      <circle cx="210" cy="60" r="18"/>
      <circle cx="360" cy="60" r="18"/>
      <circle cx="510" cy="60" r="18"/>
      <circle cx="60" cy="210" r="18"/>
      <circle cx="210" cy="210" r="18"/>
      <circle cx="360" cy="210" r="18"/>
      <circle cx="510" cy="210" r="18"/>
    </g>
  </g>
  <g fill="#f7bf4f">
    <circle cx="190" cy="690" r="18"/>
    <circle cx="252" cy="690" r="18"/>
    <circle cx="314" cy="690" r="18"/>
  </g>
  <g stroke="#f7f7fb" stroke-opacity=".72" stroke-width="10" stroke-linecap="round">
    <path d="M430 690h270"/>
    <path d="M430 725h190"/>
  </g>
</svg>
